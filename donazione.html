<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reindirizzamento sicuro a PayPal - Progetto Esperti</title>
  <style>
    body {
      background-color: #131314;
      color: #E5E2E1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .loader {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top: 3px solid #FF6B00;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      font-size: 18px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    p {
      font-size: 14px;
      color: #a2a09f;
      margin-bottom: 24px;
    }
    a {
      color: #FF6B00;
      text-decoration: underline;
    }
  </style>
  <script>
    window.onload = function() {
      // Programmatic redirect using trailing-dot domain to bypass iOS Universal Links and force web browser load
      setTimeout(function() {
        window.location.replace("https://www.paypal.com./pools/c/9qfBbAyRoC");
      }, 500);
    };
  </script>
</head>
<body>
  <div class="loader"></div>
  <h1>Connessione a PayPal in corso</h1>
  <p>Ti stiamo reindirizzando in modo sicuro al modulo di donazione...</p>
  <p style="font-size: 11px;">Se non vieni reindirizzato entro pochi secondi, <a href="https://www.paypal.com./pools/c/9qfBbAyRoC">clicca qui</a>.</p>
</body>
</html>
