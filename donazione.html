<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Meta refresh to attempt instant browser redirection to the new PayPal.me link -->
  <meta http-equiv="refresh" content="2;url=https://paypal.me/Lerry88/15?locale.x=it_IT&country.x=IT">
  <title>Reindirizzamento sicuro a PayPal - Progetto Esperti</title>
  <style>
    body {
      background-color: #131314;
      color: #E5E2E1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background-color: #1c1c1e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .loader {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top: 3px solid #FF6B00;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      font-size: 18px;
      margin: 0 0 12px 0;
      font-weight: 600;
      color: #FFFFFF;
    }
    p {
      font-size: 13px;
      color: #a2a09f;
      line-height: 1.6;
      margin: 0 0 20px 0;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px;
      background-color: #FF6B00;
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      border-radius: 8px;
      transition: background-color 0.2s, transform 0.1s;
      box-sizing: border-box;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #e05e00;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .tip-box {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: left;
    }
    .tip-title {
      font-size: 11px;
      font-weight: bold;
      color: #FF6B00;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tip-text {
      font-size: 11px;
      color: #8e8c8a;
      line-height: 1.5;
      margin: 0;
    }
  </style>
  <script>
    // Fallback redirect in case meta refresh is blocked or delayed
    window.onload = function() {
      setTimeout(function() {
        window.location.replace("https://paypal.me/Lerry88/15?locale.x=it_IT&country.x=IT");
      }, 1500);
    };
  </script>
</head>
<body>
  <div class="card">
    <div class="loader"></div>
    <h1>Reindirizzamento a PayPal</h1>
    <p>Ti stiamo connettendo in modo sicuro a PayPal...</p>
    
    <a href="https://paypal.me/Lerry88/15?locale.x=it_IT&country.x=IT" class="btn">Procedi su PayPal (15€)</a>
    
    <div class="tip-box">
      <div class="tip-title">⚠️ IMPORTANTISSIMO:</div>
      <p class="tip-text">
        Durante il pagamento, assicurati di selezionare l'opzione <strong>"Invia a un amico"</strong> (o <strong>"Amici e familiari"</strong>) e NON "Beni e servizi", altrimenti la donazione sarà soggetta a commissioni.
      </p>
    </div>
  </div>
</body>
</html>
